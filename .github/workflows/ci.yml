name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        # macOS runners queue slowly; one Python version is enough there because
        # what differs on macOS is the shell (bash 3.2), not Python.
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile everything
        run: python -m compileall -q . || true

      - name: Ledger tests
        run: python tests/test_ledger.py

      - name: Local AI client tests
        run: python tests/test_local_ai.py

      - name: Provider wizard tests
        run: python tests/test_setup_provider.py

      - name: Example app end-to-end
        run: python tests/test_example.py

      - name: Shell installers parse
        shell: bash
        run: |
          bash -n install.sh
          bash -n setup.sh
          python -c "import json;json.load(open('providers.json'));print('providers.json ok')"

      - name: PowerShell installers parse
        if: matrix.os == 'windows-latest'
        run: |
          $ErrorActionPreference='Stop'
          foreach ($f in @('install.ps1','setup.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
            Write-Host "$f parses clean"
          }

      # Actually run the installers, not just parse them. /bin/bash is bash 3.2 on
      # macOS, which is where empty arrays + `set -u` used to blow up.
      - name: setup.sh smoke run (no tty, empty args)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          /bin/bash setup.sh </dev/null >smoke.txt 2>&1 || true
          cat smoke.txt
          grep -q "AI provider setup -" smoke.txt
          grep -q "nothing saved" smoke.txt
          if grep -q "unbound variable" smoke.txt; then exit 1; fi
          if grep -q "Traceback" smoke.txt; then exit 1; fi

      - name: setup.ps1 smoke run (wizard reached)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File setup.ps1 -BaseUrl http://127.0.0.1:1/v1 -Model smoke-model *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Saved \.env') { Write-Host 'wizard never ran'; exit 1 }
          exit 0
